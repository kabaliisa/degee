spring:
  application:
    name: deegee-api
  datasource:
    url: ${DEEGEE_DB_URL:jdbc:postgresql://localhost:5432/deegee}
    username: ${DEEGEE_DB_USER:deegee}
    password: ${DEEGEE_DB_PASSWORD:deegee}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway owns the schema; Hibernate only checks it matches
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 100MB # a WAV master of a long song
      max-request-size: 105MB

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health

deegee:
  # Phone numbers that get admin rights when they sign in (comma-separated). Empty means no admins.
  admin-phones: ${DEEGEE_ADMIN_PHONES:}
  media:
    # Uploaded audio, covers and documents. A local folder in development; object storage (S3/R2) in production.
    dir: ${DEEGEE_MEDIA_DIR:./media}
    signed-url-ttl: 1h
  payouts:
    min-withdrawal-ugx: 10000
    sale-hold: ${DEEGEE_SALE_HOLD:7d} # sales and gifts wait this long before they can be withdrawn (refunds, disputes)
    new-artist-hold: ${DEEGEE_NEW_ARTIST_HOLD:30d} # longer hold while an artist is new, in case of rights claims
    new-artist-period: 60d
  cors:
    # Browsers that may call the API: the Expo web dev server. Phones don't need this.
    allowed-origins: ${DEEGEE_CORS_ORIGINS:http://localhost:8081,http://localhost:19006}
  security:
    # Signs access tokens. MUST be overridden in every real environment (at least 32 bytes).
    jwt-secret: ${DEEGEE_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  otp:
    ttl: 5m
    max-attempts: 5
    max-requests-per-hour: 5
  payments:
    # Mock mobile money: approves every top-up after a short delay, as if the user entered their PIN.
    mock-auto-approve: true
    mock-approve-delay: 2s
    # Signs mock provider webhooks. MUST be overridden in every real environment.
    webhook-secret: ${DEEGEE_WEBHOOK_SECRET:dev-only-webhook-secret}

logging:
  level:
    app.deegee: INFO
