spring:
  application:
    name: deegee-api
  datasource:
    url: ${DEEGEE_DB_URL:jdbc:postgresql://localhost:5432/deegee}
    username: ${DEEGEE_DB_USER:deegee}
    password: ${DEEGEE_DB_PASSWORD:deegee}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway owns the schema; Hibernate only checks it matches
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 100MB # a WAV master of a long song
      max-request-size: 105MB

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health

deegee:
  demo:
    # Five invented artists and sixteen AI-generated songs, loaded into an empty database at
    # startup. Off unless asked for: it exists so a laptop or a demo has something to show, and a
    # stranger arriving at Deegee should never be shown music nobody made. Set
    # DEEGEE_DEMO_CATALOGUE=true where you want it; never set it in production.
    catalogue: ${DEEGEE_DEMO_CATALOGUE:false}
  # Phone numbers that get admin rights when they sign in (comma-separated). Empty means no admins.
  admin-phones: ${DEEGEE_ADMIN_PHONES:}
  media:
    # Uploaded audio, covers and documents. A local folder in development; object storage (S3/R2) in production.
    dir: ${DEEGEE_MEDIA_DIR:./media}
    signed-url-ttl: 1h
  audio:
    # Encodes previews and streams. Install it with `brew install ffmpeg` (Mac) or `apt install ffmpeg`.
    ffmpeg: ${DEEGEE_FFMPEG:ffmpeg}
    target-lufs: -14
    max-boost-db: 10
    stream-bitrate: 128k
    preview-sec: 30
    timeout: 5m
    synchronous: false
  payouts:
    min-withdrawal-ugx: 10000
    sale-hold: ${DEEGEE_SALE_HOLD:7d} # sales and gifts wait this long before they can be withdrawn (refunds, disputes)
    new-artist-hold: ${DEEGEE_NEW_ARTIST_HOLD:30d} # longer hold while an artist is new, in case of rights claims
    new-artist-period: 60d
  cors:
    # Browsers that may call the API: the Expo web dev server, and wherever the PWA is hosted.
    # Phones running the native app don't need this.
    allowed-origins: ${DEEGEE_CORS_ORIGINS:http://localhost:8081,http://localhost:19006}
  security:
    # Signs access tokens. MUST be overridden in every real environment (at least 32 bytes).
    jwt-secret: ${DEEGEE_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  otp:
    ttl: 5m
    max-attempts: 5
    max-requests-per-hour: 5
  payments:
    # Which mobile money provider actually moves money. "mock" prompts nobody and approves on a
    # timer, which is what development and the tests want. "dusupay" reaches MTN and Airtel for
    # real, and needs the four dusupay values below.
    provider: ${DEEGEE_PAYMENTS_PROVIDER:mock}
    # Who sends money OUT. Defaults to the collections provider, which is right for anyone who
    # does both. DPO collects but publishes no payout API, so with DPO this has to name someone
    # else or artist withdrawals fail loudly -- which is the intended behaviour, not a bug.
    payout-provider: ${DEEGEE_PAYOUT_PROVIDER:${DEEGEE_PAYMENTS_PROVIDER:mock}}
    dpo:
      base-url: ${DEEGEE_DPO_BASE_URL:https://secure.3gdirectpay.com/API/v6/}
      company-token: ${DEEGEE_DPO_COMPANY_TOKEN:}
      # All three are issued per merchant and depend on DPO's terminal settings for the account.
      # Ask their team; a guess means every payment is refused.
      service-type: ${DEEGEE_DPO_SERVICE_TYPE:}
      mtn-mno: ${DEEGEE_DPO_MTN_MNO:MTN}
      airtel-mno: ${DEEGEE_DPO_AIRTEL_MNO:Airtel}
      mno-country: ${DEEGEE_DPO_MNO_COUNTRY:uganda}
      back-url: ${DEEGEE_DPO_BACK_URL:}
      redirect-url: ${DEEGEE_DPO_REDIRECT_URL:}
      payment-time-limit-minutes: ${DEEGEE_DPO_PTL:15}
    dusupay:
      # sandboxapi.dusupay.com until the merchant account is live.
      base-url: ${DEEGEE_DUSUPAY_BASE_URL:https://sandboxapi.dusupay.com}
      public-key: ${DEEGEE_DUSUPAY_PUBLIC_KEY:}
      secret-key: ${DEEGEE_DUSUPAY_SECRET_KEY:}
      # From the merchant dashboard, and not the same as the two above: whoever holds this can
      # tell Deegee that any payment succeeded.
      signing-key: ${DEEGEE_DUSUPAY_SIGNING_KEY:}
      # The buyer carries DusuPay's cut, which is the processing-fee model the prices assume.
      # Turning this off means Deegee pays it out of its own share -- and means taking the
      # matching warning off the checkout screen.
      charge-customer: ${DEEGEE_DUSUPAY_CHARGE_CUSTOMER:true}
    # Mock mobile money: approves every top-up after a short delay, as if the user entered their PIN.
    mock-auto-approve: true
    mock-approve-delay: 2s
    # Signs mock provider webhooks. MUST be overridden in every real environment.
    webhook-secret: ${DEEGEE_WEBHOOK_SECRET:dev-only-webhook-secret}

  notify:
    # "log" writes every notification to the log and sends nothing, which is what development and
    # the tests want -- and what production wants until the app ships a build that can register a
    # push token. "expo" sends them through Expo's push service, which costs nothing.
    provider: ${DEEGEE_NOTIFY_PROVIDER:log}
    expo-url: ${DEEGEE_EXPO_PUSH_URL:https://exp.host/--/api/v2/push/send}

logging:
  level:
    app.deegee: INFO
