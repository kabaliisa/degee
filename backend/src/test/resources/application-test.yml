spring:
  datasource:
    url: jdbc:h2:mem:deegee;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""

deegee:
  admin-phones: "+256700000001"
  media:
    dir: ${java.io.tmpdir}/deegee-test-media
  audio:
    synchronous: true # process in the request thread, so tests see the result straight away
  payments:
    mock-auto-approve: false # tests confirm top-ups and payouts through the webhook explicitly
  payouts:
    sale-hold: 0s # tests withdraw straight away; EarningsHoldTest covers the holds
    new-artist-hold: 0s
