<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: the hero photo runs under the status bar, and safe-area insets work once installed. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>%WEB_TITLE%</title>
    <meta
      name="description"
      content="Buy music straight from Ugandan artists with mobile money. Yours to keep."
    />

    <!-- Installable: Android reads the manifest, iOS reads the apple-* tags. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#101014" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Deegee" />
    <!-- black-translucent lets the hero show through behind the clock. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Ink while the bundle loads, so an installed app opens dark rather than flashing white. */
      html,
      body,
      #root {
        background-color: #101014;
      }
      /* The app is a phone-shaped column; centre it rather than stretching it across a desktop. */
      @media (min-width: 560px) {
        body {
          background-color: #17171d;
        }
        #root {
          width: 100%;
          max-width: 460px;
          margin: 0 auto;
          box-shadow: 0 0 60px rgba(0, 0, 0, 0.45);
        }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <script>
      // Registered after load so it never competes with the first paint on a slow connection.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {
            // No service worker means no offline shell; the app still works online.
          });
        });
      }
    </script>
  </body>
</html>
