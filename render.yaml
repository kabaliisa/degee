# Render reads this when you point it at the repo: Dashboard -> New -> Blueprint.
#
# The database is deliberately NOT here. Render's own free Postgres is deleted thirty days after it is
# created, which would take the demo down without warning; Neon's free tier does not expire. So the
# database lives at Neon and this service is handed its connection details.
#
# Everything marked `sync: false` has to be filled in once in the Render dashboard. They are secrets,
# and secrets do not belong in a public repository.
services:
  - type: web
    name: deegee-api
    runtime: docker
    repo: https://github.com/kabaliisa/degee
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    # The listeners are in Kampala, not Dallas. Uganda is landlocked: its traffic runs overland to
    # Mombasa and then north up the Red Sea cables to Europe, so Frankfurt is both the nearest of
    # Render's five regions (about 5,900 km, against 11,900 to Ohio) and the one that cable path
    # already points at. Nairobi would be better; Render does not offer it.
    #
    # A region cannot be changed after a service is created. Editing this line does not move the
    # running service -- it only tells Render where to put the NEXT one. DEPLOY.md has the cutover.
    region: frankfurt
    # Free services sleep after fifteen minutes and take about a minute to wake. Hit this URL once
    # before a demo and the first visitor does not pay for the wake-up.
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      # From Neon. Note the shape: Spring wants a jdbc: URL and the credentials separately, which is
      # not the postgres://user:pass@host/db that Neon hands you. DEPLOY.md spells out the split.
      - key: DEEGEE_DB_URL
        sync: false
      - key: DEEGEE_DB_USER
        sync: false
      - key: DEEGEE_DB_PASSWORD
        sync: false
      # Signs access tokens. Anyone holding this can mint a session as any user.
      - key: DEEGEE_JWT_SECRET
        generateValue: true
      # Signs the mock payment provider's webhooks.
      - key: DEEGEE_WEBHOOK_SECRET
        generateValue: true
      # Browsers allowed to call the API: wherever the PWA is served from. Without the site's own
      # origin here, every request from it fails CORS and the app looks broken while the API is fine.
      - key: DEEGEE_CORS_ORIGINS
        sync: false
      # Phone numbers that get admin rights on sign-in. Yours, so you can see the studio side.
      # Mobile money. "mock" approves on a timer and prompts nobody; switch to "dusupay" with the
      # four keys below once the merchant account is live. The signing key is the one that matters:
      # whoever holds it can tell Deegee that any payment succeeded.
      - key: DEEGEE_PAYMENTS_PROVIDER
        sync: false
      # DPO collects but publishes no payout API, so with DPO this must name someone who does,
      # or artist withdrawals fail loudly. Left unset it follows the collections provider.
      - key: DEEGEE_PAYOUT_PROVIDER
        sync: false
      - key: DEEGEE_DPO_COMPANY_TOKEN
        sync: false
      - key: DEEGEE_DPO_SERVICE_TYPE
        sync: false
      - key: DEEGEE_DPO_MTN_MNO
        sync: false
      - key: DEEGEE_DPO_AIRTEL_MNO
        sync: false
      - key: DEEGEE_DPO_BACK_URL
        sync: false
      - key: DEEGEE_DPO_REDIRECT_URL
        sync: false
      - key: DEEGEE_DUSUPAY_BASE_URL
        sync: false
      - key: DEEGEE_DUSUPAY_PUBLIC_KEY
        sync: false
      - key: DEEGEE_DUSUPAY_SECRET_KEY
        sync: false
      - key: DEEGEE_DUSUPAY_SIGNING_KEY
        sync: false
      - key: DEEGEE_ADMIN_PHONES
        sync: false
